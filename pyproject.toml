[project]
name = "clonerbot"
version = "0.1.0"
description = "Autonomous crypto copy-trading bot: parses Telegram signals and executes risk-managed spot trades across exchanges. Paper-mode first."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "SQLAlchemy>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "ccxt>=4.3",
    "telethon>=1.36",
    "aiogram>=3.7",
    "anthropic>=0.34",
    "redis>=5.0",
    "structlog>=24.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
clonerbot = "clonerbot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clonerbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI/pydantic-style defaults; UP042: str+Enum is intentional here.
ignore = ["B008", "UP042"]
